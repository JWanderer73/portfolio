<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jake_Wanderer: Meta</title>
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="../global.js"></script>
    <script type="module" src="main.js"></script>
</head>
<body>
    <h1>Meta</h1>
    <p>Stats about the code behind this website.</p>
    <div id="stats"></div>
    <p id="selection-count">No commits selected</p>
    <dl id="language-breakdown" class="stats"></dl>
    <div style="display: flex; flex: 1; align-items: baseline;">
        <label>
            Show commits until:
            <input type="range" id="commit-progress" min="0" max="100" value="100" style="width: 640px;">
            <time id="commit-time" style="margin-left: auto;"></time>
        </label>
    </div>
    <div id="scrolly-1">
        <div id="scatter-story"></div>
        <div id="scatter-plot">
            <h2>Commits by time of day</h2>
            <div id="chart"></div>
            <dl id="commit-tooltip" class="info tooltip" hidden>
                <dt>Commit</dt>
                <dd><a href="" id="commit-link" target="_blank"></a></dd>
                <dt>Date</dt>
                <dd id="commit-date"></dd>
                <dt>Time</dt>
                <dd id="tooltip-time"></dd>
                <dt>Author</dt>
                <dd id="commit-author"></dd>
                <dt>Lines edited</dt>
                <dd id="commit-lines"></dd>
            </dl>
            <dl id="files"></dl>
        </div>
    </div>
</body>
</html>
